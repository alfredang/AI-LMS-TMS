<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Course Selection</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  </head>
  <body style="font-family:sans-serif;max-width:600px;margin:auto;padding:40px">
    <h2>Course Registration</h2>
    <label>Name:</label>
    <input id="name" style="width:100%;margin-bottom:10px" placeholder="Enter your name" />

    <label>Course:</label>
    <select id="course" style="width:100%;margin-bottom:10px"></select>

    <label>Email:</label>
    <input id="email" style="width:100%;margin-bottom:10px" placeholder="Enter your email" />

    <button id="submit">Submit</button>
    <p id="status"></p>

    <script>
      google.script.run.withSuccessHandler(function(courses) {
        const $select = $('#course');
        courses.forEach(c => $select.append(`<option value="${c.code}" data-title="${c.name}">${c.label}</option>`));
        $select.select2({ placeholder: "Search and select a course", width: 'resolve' });
      }).getCourses();

      $('#submit').on('click', function() {
        const selected = $('#course option:selected');
        const data = {
          name: $('#name').val(),
          email: $('#email').val(),
          courseCode: selected.val(),
          courseTitle: selected.data('title')
        };
        google.script.run.withSuccessHandler(function(msg){
          $('#status').text(msg).css('color','green');
          $('#name, #email').val('');
          $('#course').val(null).trigger('change');
        }).submitForm(data);
      });
    </script>
  </body>
</html>
