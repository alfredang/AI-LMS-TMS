name: tertiary-lms-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # This branch is available on the Windows host at localhost:3000.
      # The app continues to listen on the standard port 3000 in its own container.
      - "3000:3000"
    env_file:
      # .env.local contains this branch's live Tertiary production DATABASE_URL.
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Override browser/callback URLs for this local Docker instance without
      # changing the existing port-3003 settings in .env.local.
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Prevent this local production-data instance from running scheduled jobs.
      ENABLE_APP_SCHEDULER: "false"
      ENABLE_TPG_RENEWAL_TRIAL: "true"
      TPG_RENEWAL_JOB_DIR: /app/tpg-renewal-jobs
    volumes:
      - tertiary_uploads_data:/app/public/uploads
      - tertiary_renewal_jobs_data:/app/tpg-renewal-jobs
    restart: unless-stopped

volumes:
  tertiary_uploads_data:
  tertiary_renewal_jobs_data:
