# Coolify uses Nixpacks (not the Dockerfile) to build this app. By default
# Nixpacks auto-detects Node and produces a stripped image with no browser
# binary, which silently breaks Phase 4 of the slide generator (AntV →
# Chromium → PNG via lib/cw-slides-infographic.ts). This file extends the
# auto-detected Node build with the Chromium binary + the system libs it
# needs at runtime, so production decks render the infographic images
# instead of falling back to text-only slides.
#
# Strategy: instead of declaring each apt package by name (brittle across
# Debian versions — 12/bookworm renamed libasound2 → libasound2t64 etc.),
# we let Playwright's own installer handle apt deps via `--with-deps`.
# Playwright detects the OS and installs the right package names. Falls
# back to a browser-only install if --with-deps fails (in case the build
# container lacks apt sudo permissions).

[phases.install]
# Replaces the default install step. Keeps `npm ci` (so dependencies are
# installed) and adds Playwright Chromium download with system deps.
# Total adds ~280 MB to the image but is required for AntV → PNG.
cmds = [
  "npm ci",
  "npx playwright install --with-deps chromium || npx playwright install chromium",
]
