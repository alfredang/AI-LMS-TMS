title: AI-LMS-TMS Documentation
description: Comprehensive Learning & Training Management System for Singapore's SkillsFuture Ecosystem
remote_theme: just-the-docs/just-the-docs
baseurl: "/AI-LMS-TMS"
url: "https://alfredang.github.io"

# Color scheme (custom dark blue theme)
color_scheme: dark_blue

# Logo
logo: "/assets/images/logo.png"

# Aux links (top right)
aux_links:
  "Live Demo":
    - "https://ai-lms-tms.vercel.app/"
  "GitHub":
    - "https://github.com/alfredang/AI-LMS-TMS"

aux_links_new_tab: true

# Footer
footer_content: "Copyright &copy; 2024-2026 Tertiary Infotech Pte Ltd. All rights reserved."

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Enable copy code button
enable_copy_code_button: true

# Heading anchor links
heading_anchors: true

# Collections for navigation
just_the_docs:
  collections:
    user-guides:
      name: User Guides
      nav_exclude: false
      search_exclude: false
